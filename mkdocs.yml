site_name: CSF302
site_url: https://github.com/norbutlepcha25/CSF302

use_directory_urls: false

# CHANGED: uncomment once every file listed in `nav` exists. Strict mode turns
# "file referenced in nav but not found" into a build failure instead of a
# warning you scroll past.
# strict: true

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    # REMOVED: toc.integrate
    #   It merges the page TOC into the LEFT sidebar and removes the right-hand
    #   one. Without it the TOC moves to the right column: left=nav,
    #   middle=content, right=page TOC. Put it back if you prefer the old
    #   layout — nothing else depends on it.
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.tooltips
    - content.footnote.tooltips
    # OPTIONAL: adds an "Edit this page" pencil. Needs repo_url + edit_uri below.
    # - content.action.edit

  language: en
  palette:
    - scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      accent: blue
      primary: blue grey
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Roboto
    code: Source Code Pro
  icon:
    logo: material/code-json

# OPTIONAL: lets students open an issue or a PR against a page directly.
# repo_url: https://github.com/norbutlepcha25/CSF302
# repo_name: norbutlepcha25/CSF302
# edit_uri: edit/main/docs/

extra_css:
  - stylesheets/color.css
  - https://unpkg.com/katex@0/dist/katex.min.css

copyright: |
  &copy; 2026 <a href="https://github.com/cslivenote" target="_blank" rel="noopener">Norbu Tshering Lepcha</a>

extra:
  generator: false
  base_url: /CSF302

markdown_extensions:
  # ADDED: MkDocs enables `toc` implicitly, but with no options. Configuring it
  # gives every heading a ¶ anchor, so you can link straight to a section
  # instead of "scroll down a bit". toc_depth 2-3 keeps the right-hand TOC to
  # sections and steps, not sub-steps.
  - toc:
      permalink: true
      toc_depth: "2-3"
  - def_list
  - footnotes
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      preserve_tabs: true
      custom_fences:
        - name: mermaid
          class: mermaid
  - admonition
  - pymdownx.details
  - abbr
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true

  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

plugins:
  - search
  - glightbox
  # The macros plugin reads {{ ... }} in every page as Jinja2. That breaks any
  # page showing literal double-curly syntax (e.g. Go templates, other
  # templating examples). Two ways to protect a page — pick ONE:
  #   1. wrap the affected code blocks in {% raw %} / {% endraw %}
  #   2. put `render_macros: false` in the page's YAML front matter
  # Do not use both on one page: with macros disabled, {% raw %} tags stop
  # being stripped and show up literally in the rendered output.
  - macros:
      module_name: main
      include_dir: macros
      include_yaml:
        - macros/vars.yml
        - macros/glossary.yml
        - macros/learning_outcomes.yml

  # KEEP, but pin it. mkdocs-minify-plugin pulls in jsmin and csscompressor,
  # which are unmaintained source-only packages that can fail to build on a
  # fresh install. Freeze the whole toolchain in requirements.txt and install
  # with `pip install -r requirements.txt`:
  #     mkdocs-material==9.7.6
  #     mkdocs-macros-plugin==1.5.0
  #     mkdocs-glightbox==0.5.2
  #     mkdocs-minify-plugin==0.8.0
  #     pymdown-extensions==10.21.2
  - minify:
      minify_html: true

